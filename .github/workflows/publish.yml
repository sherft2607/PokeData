name: Publish PokeData

on:
  push:
    tags:
      - 'v*.*.*'

# GITHUB_TOKEN needs write access to create the Release and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # SDK 8 builds net48, net7.0-windows, net7.0 AND the net8.0 test project.
          # SDK 7 cannot build the test project.
          dotnet-version: '8.x'

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must be vX.Y.Z (yak needs a 3-part version), got '$tag'" }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Stamp manifest.yml version
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          (Get-Content manifest.yml) -replace '^version:.*$', "version: $ver" | Set-Content manifest.yml -Encoding utf8
          echo "Restling — manifest.yml version set to $ver"

      - name: Restore
        run: |
          echo "Restling — restoring packages..."
          dotnet restore PokeData.csproj
          dotnet restore PokeData.Tests/PokeData.Tests.csproj

      - name: Build net48 (Rh7 Win)
        run: |
          echo "Restling — building net48..."
          dotnet build PokeData.csproj -c Release -f net48 --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Build net7.0-windows (Rh8 Win)
        run: |
          echo "Restling — building net7.0-windows..."
          dotnet build PokeData.csproj -c Release -f net7.0-windows --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Build net7.0 (Rh8 Mac)
        run: |
          echo "Restling — building net7.0..."
          dotnet build PokeData.csproj -c Release -f net7.0 --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test (parsing logic, net8.0)
        run: |
          echo "Restling — running tests..."
          dotnet test PokeData.Tests/PokeData.Tests.csproj -c Release --no-restore

      - name: Install Yak
        run: |
          $yakUrl = "https://files.mcneel.com/yak/tools/latest/yak.exe"
          Invoke-WebRequest -Uri $yakUrl -OutFile "$env:RUNNER_TEMP\yak.exe"
          echo "YAK=$env:RUNNER_TEMP\yak.exe" >> $env:GITHUB_ENV

      # manifest.yml + PokeDataLogo.png are already in each output folder — the csproj copies
      # them on build (pr-vs-project). yak packages the folder it runs in.
      - name: Package net48 (rh7 any)
        working-directory: bin/Release/net48
        run: |
          echo "Restling — packaging net48..."
          & $env:YAK build

      - name: Package net7.0-windows (rh8 win)
        working-directory: bin/Release/net7.0-windows
        run: |
          echo "Restling — packaging net7.0-windows..."
          & $env:YAK build --platform win

      - name: Package net7.0 (rh8 mac)
        working-directory: bin/Release/net7.0
        run: |
          echo "Restling — packaging net7.0..."
          & $env:YAK build --platform mac

      - name: Collect packages
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path bin/Release -Recurse -Filter *.yak | Copy-Item -Destination dist/
          $count = (Get-ChildItem dist/*.yak).Count
          if ($count -ne 3) { throw "Expected 3 .yak packages, found $count" }
          echo "Restling complete. Packages in dist/:"
          Get-ChildItem dist/

      # Plain "copy into Grasshopper's Components Folder" zips (.gha + DLLs + INSTALL.txt),
      # the same layout uploaded to Food4Rhino.
      - name: Build Libraries-folder zips
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $note = @"
          PokeData $ver — Grasshopper plugin for PokeAPI
          https://github.com/sherft2607/PokeData

          Install
            1. In Grasshopper: File > Special Folders > Components Folder
            2. Copy every file from this zip into that folder (keep them together —
               PokeData.gha needs the .dll files beside it)
            3. If Windows blocked the files: right-click each > Properties > Unblock
            4. Restart Rhino — the PokeData tab appears in Grasshopper

          Rhino 8: the plugin needs the .NET Core runtime (Rhino 8's default).
          If the tab is missing, run SetDotNetRuntime, choose .NET Core, restart.

          No token or account needed — PokeAPI is fully public.

          Docs: https://github.com/sherft2607/PokeData/tree/main/docs
          "@
          $targets = @{ "net48" = "rh7-win"; "net7.0-windows" = "rh8-win"; "net7.0" = "rh8-mac" }
          foreach ($tfm in $targets.Keys) {
            $stage = "$env:RUNNER_TEMP\zip-$tfm"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Get-ChildItem "bin/Release/$tfm" -Include *.gha, *.dll -Recurse -Depth 0 | Copy-Item -Destination $stage
            Set-Content -Path "$stage\INSTALL.txt" -Value $note -Encoding utf8
            Compress-Archive -Path "$stage\*" -DestinationPath "dist/PokeData-$ver-$($targets[$tfm]).zip" -Force
          }
          Get-ChildItem dist/*.zip

      # softprops/action-gh-release's temp-dir handling is unreliable on windows-latest
      # ("Error creating asset temp dir") — hand the built assets to a Linux job for the
      # actual Release upload instead of running it here.
      - name: Upload dist/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # gh needs a git checkout (or an explicit --repo) to resolve which repository to act on —
      # without one it has nothing to infer the target from.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist/ artifact
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Verify downloaded assets
        run: |
          echo "Restling — dist/ contents after artifact download:"
          ls -la dist/
          count=$(ls dist/*.zip dist/*.yak 2>/dev/null | wc -l)
          if [ "$count" -ne 6 ]; then
            echo "::error::Expected 6 release assets (3 .yak + 3 .zip), found $count"
            exit 1
          fi

      # softprops/action-gh-release@v2 hit "Error creating asset temp dir" on both Windows and
      # Linux runners when a stale draft/release already existed for this tag (left over from a
      # failed prior attempt) — its delete-then-reupload reconciliation path is flaky under that
      # condition. gh (preinstalled on GitHub-hosted runners) uploads sequentially and has no such
      # issue; deleting any leftover release for this tag first guarantees a clean create.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes --repo "${{ github.repository }}" || true
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.yak \
            --repo "${{ github.repository }}" \
            --title "PokeData ${{ needs.build.outputs.version }}" \
            --generate-notes
          echo "Restling — release created:"
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}"
